<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raminta Guinée – Carte Visa Prépayée</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brand:  #2D3192;
      --green:  #16A34A;
      --text:   #111827;
      --muted:  #6B7280;
      --border: #E5E7EB;
      --bg:     #F4F5FB;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #060E1F 0%, #0D1B3E 55%, #16275e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* ── LOGO ── */
    .top-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 8px;
      margin-bottom: 32px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      background: #fff;
      border-radius: 10px;
      padding: 6px 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      flex-shrink: 0;
    }
    .top-logo img#logoImg   { height: 36px; width: auto; object-fit: contain; flex-shrink: 0; }
    .partner-label { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.6); text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
    .partner-logo  { height: 36px; width: auto; object-fit: contain; flex-shrink: 0; }

    /* ── CARD IMAGE ── */
    .card-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .card-box {
      background: #fff;
      border-radius: 22px;
      padding: 4px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.07);
      animation: cardFloat 6s ease-in-out infinite;
      display: inline-block;
    }
    .card-box img { width: 240px; border-radius: 16px; display: block; }
    @keyframes cardFloat {
      0%,100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-10px) rotate(-1.5deg); }
    }

    /* ── HEADLINE ── */
    .headline {
      text-align: center;
      margin-bottom: 36px;
    }
    .headline h1 {
      font-size: clamp(20px, 4vw, 26px);
      font-weight: 800;
      color: #fff;
      letter-spacing: -.4px;
      margin-bottom: 8px;
    }
    .headline p {
      font-size: 15px;
      color: rgba(255,255,255,.55);
    }

    /* ── SERVICE CARDS ── */
    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 520px;
    }

    .service-card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);
      transition: transform .2s, box-shadow .2s;
      border: 2.5px solid transparent;
    }
    .service-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 70px rgba(0,0,0,.5);
    }
    .service-card.commande { border-color: #c7caf5; }
    .service-card.recharge { border-color: #bbf7d0; }

    .service-icon {
      font-size: 36px;
      line-height: 1;
    }
    .service-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
    }
    .service-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .service-btn {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
      transition: opacity .2s;
    }
    .service-card.commande .service-btn { background: var(--brand); color: #fff; }
    .service-card.recharge .service-btn { background: var(--green); color: #fff; }
    .service-card:hover .service-btn { opacity: .88; }

    /* ── FOOTER NOTE ── */
    .footer-note {
      margin-top: 36px;
      font-size: 11.5px;
      color: rgba(255,255,255,.3);
      text-align: center;
    }

    @media (max-width: 440px) {
      .services { grid-template-columns: 1fr; max-width: 320px; }
      .card-box img { width: 200px; }
    }
  </style>
</head>
<body>

  <!-- LOGO -->
  <div class="top-logo">
    <span class="logo-badge">
      <img src="Logo Raminta.png" alt="Raminta Guinée" id="logoImg"
           onerror="this.style.display='none'">
    </span>
    <span class="partner-label">Partenaire</span>
    <span class="logo-badge">
      <img src="eldorado-logo.png" alt="Eldorado Business Services" class="partner-logo">
    </span>
  </div>

  <!-- CARTE -->
  <div class="card-wrap">
    <div class="card-box">
      <img src="carte_prepayee.jpg" alt="Carte Visa prépayée Raminta">
    </div>
  </div>

  <!-- TITRE -->
  <div class="headline">
    <h1>Que souhaitez-vous faire ?</h1>
    <p>Choisissez un service ci-dessous</p>
  </div>

  <!-- SERVICES -->
  <div class="services">
    <a class="service-card commande" id="linkCommande" href="commander.html">
      <div class="service-icon">🪪</div>
      <div class="service-title">Commander une carte Visa</div>
      <div class="service-desc">Obtenez votre carte prépayée internationale</div>
      <span class="service-btn">Commander</span>
    </a>
    <a class="service-card recharge" id="linkRecharge" href="recharge.html">
      <div class="service-icon">💳</div>
      <div class="service-title">Recharger ma carte</div>
      <div class="service-desc">Ajoutez du crédit sur votre carte existante</div>
      <span class="service-btn">Recharger</span>
    </a>
  </div>

  <div class="footer-note">🔒 Vos données sont confidentielles · Raminta Guinée</div>

  <script>
    // Transmettre le slug PdV aux deux services
    const pdvSlug = new URLSearchParams(window.location.search).get('pdv') || '';

    if (pdvSlug) {
      // Valider le PdV avant d'afficher les liens
      fetch(`/api/check-pdv?slug=${encodeURIComponent(pdvSlug)}`)
        .then(r => r.json())
        .then(data => {
          if (!data.valid) {
            window.location.replace('https://macarte.ramintaguinee.com');
          } else {
            document.getElementById('linkCommande').href = `commander.html?pdv=${pdvSlug}`;
            document.getElementById('linkRecharge').href = `recharge.html?pdv=${pdvSlug}`;
          }
        })
        .catch(() => {
          document.getElementById('linkCommande').href = `commander.html?pdv=${pdvSlug}`;
          document.getElementById('linkRecharge').href = `recharge.html?pdv=${pdvSlug}`;
        });
    }
  </script>

</body>
</html>
